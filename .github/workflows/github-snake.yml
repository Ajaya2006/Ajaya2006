name: Generate contribution snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AjaySahoo
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-cyan.svg?color_snake=#00d4ff&color_dots=#0d1117,#161b22,#1f2937,#374151,#00d4ff

      - name: Push snake to output branch
        uses: crazy-max/ghaction-ghpages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
